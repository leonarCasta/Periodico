<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" aria-hidden="true" focusable="false">
  <!-- Grano de papel: ruido fractal sutil que se multiplica sobre el soporte -->
  <filter id="granoPapel" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" seed="7"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.10" intercept="0"/>
    </feComponentTransfer>
  </filter>
  <rect width="320" height="320" filter="url(#granoPapel)"/>
</svg>
