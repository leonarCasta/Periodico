      <stop offset="0" stop-color="#efe4cb"/>
      <stop offset="1" stop-color="#d8c6a0"/>
    </linearGradient>
    <filter id="grano3"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".13"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
