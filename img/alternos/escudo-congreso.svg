<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" width="460" height="460" role="img" aria-labelledby="t4 d4">
  <title id="t4">Emblema del Congreso de Anáhuac</title>
  <desc id="d4">Medallón con el escudo de armas del Congreso de Anáhuac: un águila sobre el nopal devorando una serpiente, orlado con los veintitrés capitulaciones de la Nación.</desc>
