    <radialGradient id="medalla4" cx=".5" cy=".42" r=".7">
      <stop offset="0" stop-color="#f6efdb"/>
      <stop offset="1" stop-color="#d9c8a2"/>
    </radialGradient>
    <filter id="grano4"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".13"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
  </defs>

