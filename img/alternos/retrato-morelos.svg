<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 560" width="460" height="560" role="img" aria-labelledby="t2 d2">
  <title id="t2">Retrato del general José María Morelos</title>
  <desc id="d2">Retrato grabado de un jefe insurgente con sombrero de charro, banda de general y bigote, dentro de un óvalo con orla.</desc>
  <defs>
    <pattern id="rayado2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#f0e6cf"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#c6b391" stroke-width="1.4"/>
    </pattern>
    <radialGradient id="fondo2" cx=".5" cy=".38" r=".72">
      <stop offset="0" stop-color="#f8f1df"/>
      <stop offset="1" stop-color="#d3c19a"/>
    </radialGradient>
    <clipPath id="oval2"><ellipse cx="230" cy="270" rx="176" ry="214"/></clipPath>
    <filter id="grano2"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
  </defs>

  <rect width="460" height="560" fill="#e7dcc2"/>
  <ellipse cx="230" cy="270" rx="192" ry="230" fill="none" stroke="#8a7754" stroke-width="4"/>
  <ellipse cx="230" cy="270" rx="176" ry="214" fill="url(#fondo2)"/>

  <g clip-path="url(#oval2)">
    <rect x="54" y="56" width="352" height="428" fill="url(#rayado2)" opacity=".55"/>
    <!-- hombros y uniforme -->
    <path d="M96 520c6-84 46-128 134-136 88 8 128 52 134 136z" fill="#6f6852"/>
    <path d="M118 512c8-72 42-108 112-116-24 34-34 74-36 116z" fill="#837a60"/>
    <!-- banda de general -->
    <path d="M150 384l160 130" stroke="#efe6cf" stroke-width="26"/>
    <path d="M150 384l160 130" stroke="#b9ab88" stroke-width="6" stroke-dasharray="3 12"/>
    <!-- cuello -->
    <path d="M196 330h68v56h-68z" fill="#d9c19b"/>
    <path d="M196 356c14 22 54 22 68 0v30h-68z" fill="#c0a681"/>
    <!-- rostro -->
    <path d="M230 150c46 0 70 34 70 82 0 58-30 106-70 106s-70-48-70-106c0-48 24-82 70-82z" fill="#e4cda6"/>
    <path d="M230 150c-46 0-70 34-70 82 0 12 2 22 5 32 6-40 30-62 65-62s59 22 65 62c3-10 5-20 5-32 0-48-24-82-70-82z" fill="#c9ab7f" opacity=".45"/>
    <!-- pelo -->
    <path d="M168 216c-4-52 26-78 62-78s66 26 62 78c-6-26-24-38-62-38s-56 12-62 38z" fill="#4a4235"/>
    <!-- sombrero charro -->
    <path d="M124 194c34-30 74-44 106-44s72 14 106 44c6 8-2 16-16 14-30-6-60-10-90-10s-60 4-90 10c-14 2-22-6-16-14z" fill="#6d6247"/>
    <path d="M124 194c34-30 74-44 106-44s72 14 106 44c-36-16-70-22-106-22s-70 6-106 22z" fill="#84795a"/>
    <path d="M176 178c14-24 34-36 54-36s40 12 54 36c-18-8-36-12-54-12s-36 4-54 12z" fill="#8e8464"/>
    <ellipse cx="230" cy="188" rx="9" ry="7" fill="#a89a72"/>
    <!-- ojos y ceja -->
    <g fill="#4a4235">
      <path d="M198 246c8-5 18-5 25 0-8 3-17 3-25 0z"/>
      <path d="M237 246c8-5 18-5 25 0-8 3-17 3-25 0z"/>
    </g>
    <circle cx="212" cy="254" r="4.4" fill="#3a342a"/>
    <circle cx="251" cy="254" r="4.4" fill="#3a342a"/>
    <!-- nariz y boca -->
    <path d="M230 252v22c0 4-5 6-9 6 4 3 14 3 18-1" fill="none" stroke="#b8996f" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M216 296c9 6 19 6 28 0" fill="none" stroke="#8d6a4c" stroke-width="3" stroke-linecap="round"/>
    <!-- bigote -->
    <path d="M212 288c10-6 26-6 36 0-10-1-26-1-36 0z" fill="#4a4235"/>
    <!-- perilla -->
    <path d="M226 300c6 10 10 12 14 6-2 12-16 14-18 0z" fill="#5a5142"/>
    <!-- hatching de sombra -->
    <g stroke="#8f7c5b" stroke-width="1.1" opacity=".5">
      <path d="M162 220c-6 60 4 108 30 138M298 220c6 60-4 108-30 138"/>
      <path d="M150 300c-4 70 10 116 40 150M310 300c4 70-10 116-40 150"/>
    </g>
  </g>

  <ellipse cx="230" cy="270" rx="176" ry="214" fill="none" stroke="#6f6144" stroke-width="2.4"/>
  <rect x="10" y="10" width="440" height="540" fill="none" stroke="#8a7754" stroke-width="4"/>
  <rect x="20" y="20" width="420" height="520" fill="none" stroke="#8a7754" stroke-width="1.2"/>
  <g filter="url(#grano2)"><rect width="460" height="560" fill="#ffffff" opacity=".3"/></g>
</svg>